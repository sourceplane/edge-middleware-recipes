# The epic's declaration. metadata.name equals the directory name; metadata.key
# is the task-key prefix this epic reserves (EM → EM-1, EM-2, …). Owner, target
# date and health are the platform's — never written here.
apiVersion: orun.io/v1
kind: Epic
metadata:
  name: edge-middleware-recipes
  key: EM
spec:
  title: "Vercel's Edge Middleware examples as one Cloudflare Worker of recipes"
  summary: "Thirteen of Vercel's Edge Middleware examples — geolocation, i18n, basic auth, rate limiting, A/B testing, a maintenance page, cookies, response and request headers, query filtering, a JSON response, user-agent rendering and Bloom-filter redirects — each a Next.js app whose point is its middleware.ts, ported as recipes in one Cloudflare Worker: a Hono router mounts each recipe under its own path with the upstream middleware logic intact, the Vercel-only primitive replaced by Cloudflare's (request.cf, vars and secrets, the Rate Limiting binding, an in-process rewrite), the pages it rewrites to, and a test per recipe. Inside the Cirrus baseline's repository conventions: Orun intent and components, credential-free checks, a gated Orun CI, one epic per repository — and an Orun baseline that instantiates it as somebody's own product in one landing (EM3)."
  state: completed
  milestones:
    - name: "EM0 — the spec"
      exitCriteria:
        - "the doc set and the task contracts are on main"
      tasks: [EM-1]
    - name: "EM1 — the recipes on Workers"
      exitCriteria:
        - "apps/recipes serves / (the index) and the thirteen recipes under their own paths from one plain Worker bundled by wrangler"
        - "every recipe reproduces its upstream middleware.ts behaviour, and tests/recipes proves it with app.request()"
        - "`pnpm typecheck`, `pnpm lint`, `pnpm test` and `pnpm build` are green on main (Checks)"
        - "`wrangler dev` answers each recipe's demo route as the upstream does (headers, cookies, User-Agent, the rate limit, the redirects)"
      tasks: [EM-2]
    - name: "EM2 — ready to instantiate"
      exitCriteria:
        - "the README says how to run, test, preview and deploy it through Orun, and what each recipe does"
        - "the as-built status records every departure from the upstream examples"
      tasks: [EM-3]
    - name: "EM3 — a baseline"
      exitCriteria:
        - "blueprint.yaml (the console card) and repo-blueprint.yaml (the build) take a new product from nothing to live on stage and prod in ONE landing (01-product), then record it (02-docs)"
        - "a product built from it carries the product only, renamed throughout to its own name, repository and Worker, and no shipped file names a factory path"
        - "a fresh product deploys and serves every recipe with no secret the platform cannot broker; the basic-auth recipe says how to set its pair instead of challenging forever"
        - "Baseline CI is green: contract tests, the blueprint read by the pinned orun, the leak gate, the offline bootstrap and the end-to-end tier"
      tasks: [EM-4]
