apiVersion: orun.dev/v1
kind: Blueprint
metadata:
  name: edge-middleware-recipes
  description: >-
    The edge-middleware-recipes repository as a Blueprint of itself —
    instantiate a new repository of thirteen Edge Middleware recipes
    (geolocation, i18n, basic auth, rate limiting, A/B testing, a maintenance
    page, cookies, headers, query filtering, a JSON response, user-agent
    rendering, Bloom-filter redirects) served by one Hono-routed Cloudflare
    Worker, and take it from nothing to live on stage and prod in ONE landing,
    then record it. Run one phase at a time with `--phase <name>` or the whole
    sequence with `--resume`; see docs/phases/README.md for the contract every
    phase follows, and BOOTSTRAP.md for the operator checklist no script can
    perform.

# ── INPUTS ────────────────────────────────────────────────────────────────
# The instance-identity contract, consumed by tooling/rebrand/rebrand.mjs via
# the `.rebrand/values.json` the `rebrand-values` module templates. Every
# input a later phase needs is in that file, because it is committed and so
# survives a fresh container; `.orun/provenance.lock` does not.
#
# The card (blueprint.yaml) declares a subset of these with the patterns the
# console validates; testing/manifest.test.sh fails if a card input is not
# one of these, or if one of these is required and nothing supplies it.
inputs:
  reponame:
    type: string
    pattern: "^[a-z][a-z0-9-]*$"
    required: true
    description: Repo slug (e.g. acme-recipes) — intent metadata.name, the Worker name prefix, the secret project.
  productname:
    type: string
    required: true
    description: The product's display name (e.g. "Acme Recipes") — the index page's heading and title, every page's footer.
  productdomain:
    type: string
    required: true
    description: >-
      The domain the product will answer on (e.g. acme.dev) — BASE_DOMAIN and
      the custom-domain guidance. It does not need to exist: the Worker
      answers on workers.dev from its first deploy.
  githuborg:
    type: string
    pattern: "^[A-Za-z0-9][A-Za-z0-9-]*$"
    required: true
    description: >-
      GitHub owner the product's repository is created under — and the owner
      in the source link every page's footer carries. 01-product waits for
      the App installation on THIS owner before it creates anything: the
      platform learns of a pull request only through the installation on the
      account that owns the repository.
  subdomain:
    type: string
    default: "your-workers-subdomain"
    description: >-
      The workers.dev subdomain of the Cloudflare account the product deploys
      into — its URLs, the deploy smoke, the probes. A console or
      `--from bst_…` build gets it from the workspace's Cloudflare connection
      (blueprint.yaml declares `from: connection.cloudflare.workersSubdomain`);
      pass it with --set only for a hand-run build.
  repoPrivate:
    type: boolean
    default: true
    description: >-
      Whether the repository is created private. Private is the safe default;
      `orun.repo/ensure@v1` only sets it at creation — an existing repository
      keeps the visibility it has.
  orunWorkspace:
    type: string
    default: ""
    # Unset, it is the workspace the build runs in (ORUN_WORKSPACE — which a
    # console build's sandbox always sets, and which the console form cannot
    # send). A value set on the command line or recorded by the tree wins.
    from: workspace
    description: >-
      Orun Cloud workspace (ws_…) for the product's remote state and its
      secret refs. Unset, it is the workspace the build runs in; with none
      anywhere, 01-product writes a placeholder that fails loudly rather than
      silently claiming another tenant's workspace.
  epicSlug:
    type: string
    pattern: "^[a-z][a-z0-9-]*$"
    default: edge-middleware-recipes-baselining
    description: >-
      The epic this bootstrap tracks itself under. Found by slug, so a run
      that starts fresh and a run that resumes find the same work.

# ── SOURCES ───────────────────────────────────────────────────────────────
# The baseline is this repository itself. Run `orun new` from its root so
# `path: .` resolves to it; orun pins it by digest into its object store
# before any module reads it, so an instance is reproducible and provenanced.
sources:
  - name: baseline
    kind: dir
    path: .

# Derived build output, local secrets, and the factory's own lanes — never
# carried into an instance.
#
# WHAT `ignore` ACTUALLY EXCLUDES: orun matches an entry two ways, and which
# one depends on the entry. A pattern with no glob metacharacter is compared
# against each path SEGMENT; only a pattern containing one is compared against
# the whole relative path. So `apps/recipes/.dev.vars` on its own would match
# nothing — it needs the `**/`. testing/coverage.test.sh refuses an entry that
# names a path without a glob.
ignore:
  - dist
  - coverage
  - .turbo
  - .wrangler
  - node_modules
  - .orun
  - plan.json
  - "**/*.tsbuildinfo"
  # `orun new` snapshots the WORKING TREE, not the git index: an operator's
  # local environment files would otherwise be copied into somebody else's
  # repository. `.dev.vars.example` is not among them, and ships — which is
  # why the per-environment files wrangler reads (`.dev.vars.<env>`) are named
  # one by one: orun matches with Go's path.Match, which has no "every name
  # but this one", so `**/.dev.vars.*` would drop the example too.
  - "**/.env"
  - "**/.env.local"
  - "**/.env.*.local"
  - "**/.dev.vars"
  - "**/.dev.vars.dev"
  - "**/.dev.vars.stage"
  - "**/.dev.vars.prod"
  - "**/.dev.vars.local"
  # THE FACTORY'S OWN LANES. `github-workflows` copies the whole of `.github`,
  # so without these two entries every product built from this baseline would
  # carry them — `baseline.yml` runs `testing/*.sh`, which no module places,
  # and `tag.yml` cuts baseline tags a product does not have.
  # testing/coverage.test.sh fails if a lane reading `testing/` is not here.
  - "**/.github/workflows/baseline.yml"
  - "**/.github/workflows/tag.yml"

# ── MODULES ───────────────────────────────────────────────────────────────
# One module per component or root file. Root files are single-file modules
# rather than one module with an include list: a file shipping to a product
# is a line in a diff, and nothing of the factory (specs/, tasks/, testing/,
# hooks/, docs/phases/, tooling/rebrand/, tooling/bootstrap/,
# tooling/migrations/, the blueprints, BOOTSTRAP.md) can ship by accident.
# testing/leak.test.sh holds that line.
modules:
  # ── the identity file every later phase reads back ───────────────────────
  # The only place blueprint inputs touch the tree; everything else is a
  # verbatim copy the `rebrand` hook rewrites. Committed, so a phase run months
  # later from a fresh container recovers what the operator answered.
  - name: rebrand-values
    mode: template
    files:
      ".rebrand/values.json": |
        {
          "reponame": "{{ .reponame }}",
          "productname": "{{ .productname }}",
          "productdomain": "{{ .productdomain }}",
          "subdomain": "{{ .subdomain }}",
          "orunWorkspace": "{{ .orunWorkspace }}",
          "githuborg": "{{ .githuborg }}",
          "epicSlug": "{{ .epicSlug }}"
        }

  # ── root files ───────────────────────────────────────────────────────────
  - name: root-intent
    mode: copy
    source: baseline
    from: intent.yaml
    to: intent.yaml
  - name: root-package-json
    mode: copy
    source: baseline
    from: package.json
    to: package.json
  - name: root-pnpm-workspace
    mode: copy
    source: baseline
    from: pnpm-workspace.yaml
    to: pnpm-workspace.yaml
  - name: root-pnpm-lock
    mode: copy
    source: baseline
    from: pnpm-lock.yaml
    to: pnpm-lock.yaml
  - name: root-turbo
    mode: copy
    source: baseline
    from: turbo.json
    to: turbo.json
  - name: root-gitignore
    mode: copy
    source: baseline
    from: .gitignore
    to: .gitignore
  # The PRODUCT's README, not this repository's: this one is about the
  # baseline (how to instantiate it, how it is tested), and a product's owner
  # has no use for any of that.
  - name: root-readme
    mode: copy
    source: baseline
    from: .baseline/product/README.md
    to: README.md
  - name: github-workflows
    mode: copy
    source: baseline
    from: .github
    to: .github
  - name: vscode
    mode: copy
    source: baseline
    from: .vscode
    to: .vscode

  # The two context pages a product genuinely owns: its operating contract,
  # and the deployment manifest 02-docs renders. One module per file, so a new
  # file in ai/context/ cannot ship without somebody writing a module for it.
  - name: ai-operations
    mode: copy
    source: baseline
    from: ai/context/operations.md
    to: ai/context/operations.md
  - name: ai-deployment
    mode: copy
    source: baseline
    from: ai/context/deployment.md
    to: ai/context/deployment.md

  # ── the discovery roots, declared ────────────────────────────────────────
  # orun's repo-scale gate — and later `orun plan` in the product's own CI —
  # discovers apps/, infra/, packages/ and tests/, and a missing root is a
  # hard failure. infra/ and packages/ stay empty in this product. A file the
  # tree needs in order to be valid is what a module is for.
  - name: discovery-roots
    mode: template
    files:
      "apps/.gitkeep": ""
      "infra/.gitkeep": ""
      "packages/.gitkeep": ""
      "tests/.gitkeep": ""

  # ── shared tooling ───────────────────────────────────────────────────────
  # Only what a PRODUCT runs: the TypeScript and ESLint configuration and the
  # deploy-time wrangler renderer. The factory's tooling (rebrand, bootstrap)
  # stays here, and so does `tooling/migrations`: it checks a `packages/db`
  # migration manifest, and this product has no database and nothing it runs
  # reads it.
  - name: tooling-tsconfig
    mode: copy
    source: baseline
    from: tooling/tsconfig
    to: tooling/tsconfig
  - name: tooling-eslint
    mode: copy
    source: baseline
    from: tooling/eslint
    to: tooling/eslint
  - name: tooling-wire
    mode: copy
    source: baseline
    from: tooling/wire
    to: tooling/wire

  # ── the product ──────────────────────────────────────────────────────────
  # No infra: the Worker's only bindings are vars, owner-seeded secrets and a
  # rate limiting binding wrangler creates on deploy, none of which carries a
  # resource id to wire. So nothing here waits on a data plane, and the
  # component declares no `dependsOn`.
  - name: recipes
    mode: copy
    source: baseline
    from: apps/recipes
    to: apps/recipes
    dependsOn: [tooling-eslint, tooling-tsconfig]
  - name: recipes-tests
    mode: copy
    source: baseline
    from: tests/recipes
    to: tests/recipes
    dependsOn: [recipes, tooling-eslint, tooling-tsconfig]

# ── THE WORK, UP FRONT ────────────────────────────────────────────────────
# The bootstrap is work, so it lives where work lives — and all of it is on
# the plane before the first phase places a file: one epic, one milestone per
# phase in the order the phases run, one task per landing.
#
# `hooks.preInstantiate` (orun >= v2.60) runs under no phase, once per run, on
# a resume too. Everything here is find-or-create BY IDENTITY — the epic by
# slug, a milestone by name within its epic, a task by title within its epic —
# so a second run, a resume and a redo all find what the first run made. The
# milestones are created IN ORDER and BEFORE the tasks: the plane appends each
# new milestone after the last, and a task naming a milestone the epic does
# not have yet would create it out of order.
#
# Each phase's own `pre` hook runs `orun.task/ensure@v1` on its task again.
# Same identity, so it finds rather than creates, and it is how the phase gets
# the task's KEY for its landing. The MILESTONE keeps the phase's name: it is
# the identity the engine's phase events, the plane's evidence and the
# console's rows all meet on, and the card's `programme.milestones` names the
# same list.
hooks:
  preInstantiate:
    - id: epic
      uses: orun.task/ensure@v1
      with:
        kind: epic
        slug: "{{ .inputs.epicSlug }}"
        name: "Edge middleware recipes baselining — {{ .inputs.productname }}"
        description: >-
          Everything the edge-middleware-recipes baseline builds for
          {{ .inputs.productname }} in {{ .inputs.githuborg }}/{{ .inputs.reponame }}:
          the repository, its CI and the Worker of recipes live on stage and
          prod in one landing, then the record of what went live. One
          milestone per phase, in the order the phases run; one task per
          landing, each bound to the pull request that lands it.
        owner: me
    - id: m01
      uses: orun.task/ensure@v1
      with:
        kind: milestone
        epic: "{{ .inputs.epicSlug }}"
        name: 01-product
        exitCriteria:
          - repository created under {{ .inputs.githuborg }} and linked to the workspace
          - the product merged in one pull request, main pinned as the default branch
          - the Worker deployed on stage and prod, its smoke green, the index answering on both workers.dev URLs
    - id: m02
      uses: orun.task/ensure@v1
      with:
        kind: milestone
        epic: "{{ .inputs.epicSlug }}"
        name: 02-docs
        exitCriteria:
          - ai/context/deployment.md on main matches the probed live URLs
          - prod waits on stage again
    - id: t01
      uses: orun.task/ensure@v1
      with:
        kind: task
        epic: "{{ .inputs.epicSlug }}"
        milestone: 01-product
        name: "Build the product in one landing"
        brief: >-
          Create {{ .inputs.githuborg }}/{{ .inputs.reponame }} and land the
          whole product as one pull request — the intent, CI, tooling and
          identity, the Worker of recipes and its tests, branded as
          {{ .inputs.productname }} — then see the convergence deploy the
          Worker to stage and prod, smoke-tested over HTTP.
        prefix: BASE
        contract: .baseline/tasks/01-product.TaskContract.yaml
    - id: t02
      uses: orun.task/ensure@v1
      with:
        kind: task
        epic: "{{ .inputs.epicSlug }}"
        milestone: 02-docs
        name: "Record the live deployment"
        brief: >-
          Probe every live URL one last time and write the deployment record
          into the repository from what actually answered, not from what the
          blueprint intended.
        prefix: BASE
        contract: .baseline/tasks/02-docs.TaskContract.yaml

# ── PHASES ────────────────────────────────────────────────────────────────
# A phase is orun's own barrier over the module DAG and the whole of what a
# phase DOES: what it is for a person (`title`), what to budget
# (`expectedMinutes`), what must already be true (`requires`), and the hooks
# that do its work around placement — `pre` before, `post` after, `await` for
# what is still converging when the hooks are done.
#
# THE ORDER HERE IS THE EXECUTION ORDER, and the numbered names are the names
# the task plane's milestones carry. A dependency may never point forward
# across a phase boundary; orun refuses the blueprint if one does.
#
# The product is ONE landing (cirrus-baseline's v22 shape): `01-product`
# places every module, brands the tree and lands it as one pull request, and
# the convergence after the merge deploys it. `02-docs` places nothing: it is
# a phase because it is a separately landable unit with its own task and its
# own PR. There is no domain phase — the Worker answers on workers.dev.
phases:
  - name: 01-product
    title: The product, built in one landing
    description: The whole tree — manifests, CI, tooling, identity, the Worker of recipes and its tests — branded, landed as one pull request, and deployed by one convergence.
    expectedMinutes: 6
    narrate:
      start:  "Creating the repository and landing the whole product in one pull request — intent, CI, tooling, the Worker of thirteen recipes and its tests. Then one convergence deploys the Worker to stage and prod. Usually about {{ .meta.expectedMinutes }} minutes."
      await:  "One convergence is deploying the Worker to stage and prod side by side, each deploy smoke-tested over HTTP. Nothing is stuck."
      done:   "{{ .inputs.reponame }} is live on stage and prod — {{ .meta.files }} files on main, branded as {{ .inputs.productname }}, the index answering on both workers.dev URLs. That took {{ .meta.elapsed }}."
      failed: "The product did not come up. The failing lane above names the step — the install, the build, the deploy or the smoke — and a provider error is in its log; whatever deployed is still there."
    modules: [ai-deployment, ai-operations, discovery-roots, github-workflows, rebrand-values, recipes, recipes-tests, root-gitignore, root-intent, root-package-json, root-pnpm-lock, root-pnpm-workspace, root-readme, root-turbo, tooling-eslint, tooling-tsconfig, tooling-wire, vscode]
    # THE PLATFORM MUST BE ABLE TO SEE THE REPOSITORY BEFORE IT EXISTS. Every
    # phase lands a pull request that files under its task, and the platform
    # learns of a PR only through the GitHub App installation on the account
    # that OWNS the repository. So the owner's connection is asked for here,
    # before a repository is created, and waited for like any other consent.
    # And the Cloudflare connection, which the deploy credentials below are
    # minted from — asked for here too, since this phase is the one that
    # deploys.
    requires:
      probe:
        - id: providers
          uses: orun.doctor/check@v1
          with:
            providers: [github, cloudflare]
            githubOwner: "{{ .inputs.githuborg }}"
            waitSeconds: 600
            pollSeconds: 20
    hooks:
      pre:
        # The epic, the milestones and the tasks already exist (the run-level
        # list above). This finds the task and yields its key, which the
        # landing binds the pull request to. (Under an orun older than v2.60,
        # which has no run-level list, this hook is what creates the task —
        # same identity, same result.)
        - id: task
          uses: orun.task/ensure@v1
          with:
            kind: task
            epic: "{{ .inputs.epicSlug }}"
            milestone: "{{ .phase.name }}"
            name: "Build the product in one landing"
            prefix: BASE
            contract: .baseline/tasks/01-product.TaskContract.yaml
      # The identity chain. The end of 01-product is the moment the whole tree
      # is placed. rebrand.mjs enumerates the tree with `git ls-files`, so the
      # output has to be a git repository with a populated index BEFORE it
      # runs. `git add -A` only stages; the landing commits.
      post:
        # A RE-RUN MUST HAVE SOMETHING TO LAND. A convergence can fail AFTER
        # its PR merged, and the merge has already put every file this phase
        # places on main; orun derives phase state from the tree, so a forced
        # re-run lands an EMPTY diff while the product's CI plans `--changed`.
        # So the phase rewrites ONE trailing marker line in each component.yaml
        # its contract names — `# orun: redeploy <phase> <stamp>` — and the
        # landing has a diff and exactly those components are re-planned. The
        # marker is a deploy trigger, not state: nothing reads it back.
        - id: retouch
          run: ["node", "{{ .baseline.dir }}/tooling/bootstrap/retouch.mjs", "--phase", "{{ .phase.name }}", "--affects", "{{ .baseline.dir }}/.baseline/tasks/01-product.TaskContract.yaml"]
        - id: git-init
          run: ["git", "init", "-q"]
        - id: git-stage
          run: ["git", "add", "-A"]
        - id: rebrand
          run: ["node", "{{ .baseline.dir }}/tooling/rebrand/rebrand.mjs", "--values", ".rebrand/values.json", "--allow-dirty"]
        # Re-tenant the product. rebrand.mjs treats the orun state backend as
        # org-owned and leaves it alone, so intent.yaml would keep THIS
        # repository's `workspace:` — the product's CI would then claim
        # another tenant's workspace on every remote op. Hook argv is not
        # templated, so the value travels through .rebrand/values.json, which
        # IS.
        - id: orun-workspace
          run:
            - node
            - -e
            - |
              const fs = require("fs");
              const values = JSON.parse(fs.readFileSync(".rebrand/values.json", "utf8"));
              const ws = String(values.orunWorkspace || "").trim() || "ws_SET_ME";
              const before = fs.readFileSync("intent.yaml", "utf8");
              // Look for the line rather than for a change: a product built
              // into a workspace already named there rewrites the line to the
              // value it already has, and "unchanged" is not "missing".
              const line = /^(\s*workspace:\s*).*$/m;
              if (!line.test(before)) {
                console.error("orun-workspace: no `workspace:` line in intent.yaml — refusing to guess");
                process.exit(1);
              }
              fs.writeFileSync("intent.yaml", before.replace(line, "$1" + ws));
              console.log(
                ws === "ws_SET_ME"
                  ? "orun-workspace: wrote placeholder ws_SET_ME — set your Orun Cloud workspace before enabling remote state"
                  : "orun-workspace: intent.yaml workspace -> " + ws,
              );
        # The product carries no work tree of this repository's: `specs/` and
        # `tasks/` never ship, so intent.yaml's `work:` block would point its
        # every plan at two directories that do not exist.
        - id: work-tree
          run: ["node", "{{ .baseline.dir }}/tooling/bootstrap/work-tree.mjs", "--strip"]
        # STAGE AND PROD DEPLOY SIDE BY SIDE UNTIL THE BOOTSTRAP IS DONE. The
        # promotion gate makes prod wait out stage's deploy; during a
        # bootstrap both are empty and the landing is watched to green, so it
        # protects nothing and doubles the convergence. Deferred here,
        # restored by 02-docs. tooling/bootstrap/promotion.mjs.
        - id: promotion
          run: ["node", "{{ .baseline.dir }}/tooling/bootstrap/promotion.mjs", "--defer"]
        # DEV'S VERIFY LANES STAY OFF MAIN UNTIL THE BOOTSTRAP IS DONE, by the
        # same mechanism: a third Worker build (and the tests package's check)
        # on the merge proves nothing the baseline's own CI did not. Pull
        # requests keep their dev lanes. tooling/bootstrap/dev-lanes.mjs.
        - id: dev-lanes
          run: ["node", "{{ .baseline.dir }}/tooling/bootstrap/dev-lanes.mjs", "--defer"]
        # Re-stage so `git ls-files` and `rebrand --verify` see the rewritten tree.
        - id: git-restage
          run: ["git", "add", "-A"]
        - id: rebrand-verify
          run: ["node", "{{ .baseline.dir }}/tooling/rebrand/rebrand.mjs", "--verify", "--values", ".rebrand/values.json"]
        # root-pnpm-lock places the baseline's complete lockfile and the whole
        # tree is here, so this only confirms it (a no-op). The lanes and
        # Checks install with --frozen-lockfile. The lockfile carries no
        # identity.
        - id: pnpm-lockfile
          run: ["pnpm", "install", "--lockfile-only"]
        # The repo has to exist before there is anywhere to land.
        - id: repo
          uses: orun.repo/ensure@v1
          narrate: "The repository exists at {{ .inputs.githuborg }}/{{ .inputs.reponame }}."
          with:
            owner: "{{ .inputs.githuborg }}"
            name: "{{ .inputs.reponame }}"
            private: "{{ .inputs.repoPrivate }}"
        # THE REPOSITORY MUST BE THE WORKSPACE'S before anything lands in it,
        # or the product's own CI cannot reach the platform: every convergence
        # lane authenticates over GitHub OIDC, resolved through the repo link.
        # `link` may be refused where the credential cannot write links (a
        # workspace key) and the platform has linked the repository already,
        # so it is best effort and `check` is the gate — an unlinked
        # repository stops here, naming the fix, instead of in every lane.
        - id: link
          run:
            - bash
            - -c
            - |
              orun cloud link --org "$1" || true
              orun cloud check --org "$1" || {
                echo "$2 is not linked to workspace $1 — its CI cannot authenticate. Link it (orun cloud link --org $1, or the console's Git Repos) and re-run this phase." >&2
                exit 1
              }
            - link
            - "{{ .inputs.orunWorkspace }}"
            - "{{ .inputs.githuborg }}/{{ .inputs.reponame }}"
        # The deploy credentials, brokered, one hook per template:
        # `integrations/reconcile` mints from ONE connection with ONE scope
        # template. The deploy lane binds both keys (the cloudflare-worker-turbo
        # composition's deploy `secretBindings`). Keys that already exist are
        # kept. After the link, before the landing whose convergence uses
        # them. The basic-auth pair is NOT here: no provider holds it, so it is
        # the owner's to seed (the component's `optionalSecretEnv`).
        - id: secret-workers-deploy
          uses: orun.integrations/reconcile@v1
          with:
            provider: cloudflare
            keys: [CLOUDFLARE_API_TOKEN]
            template: workers-deploy
        - id: secret-account-id
          uses: orun.integrations/reconcile@v1
          with:
            provider: cloudflare
            keys: [CLOUDFLARE_ACCOUNT_ID]
            template: account-id
        # THE PRODUCT IS A PULL REQUEST THAT IS CHECKED, THEN MERGED. This
        # landing waits for its PR's whole CI run (orun >= v2.58.6): Checks
        # over the product, and `plan` — on a bootstrap branch (`orun/BASE-…`)
        # the lanes are skipped (ci.yml), because the merge runs them on main
        # a minute later, for real, and the convergence after the merge is
        # what the `await` below watches to green.
        - id: land
          uses: orun.pr/land@v1
          narrate: "The product is merged into main."
          with:
            task: "{{ .phase.hooks.task.outputs.key }}"
            epic: "{{ .inputs.epicSlug }}"
            branchSlug: "{{ .phase.name }}"
            title: "feat: {{ .inputs.productname }}, the Edge Middleware recipes on one Worker"
      await:
        - id: converge
          uses: orun.run/watch@v1
          narrate: "The Worker built, deployed to stage and prod and passed its smoke, and the convergence run came back green."
          with:
            # The run for the commit THIS landing merged — the branch's newest
            # run, read the moment the merge returns, would be an earlier
            # push's. Only ci.yml runs on a push to main, so it is ci.yml's.
            sha: "{{ .phase.hooks.land.outputs.mergeSha }}"
            repo: "{{ .inputs.githuborg }}/{{ .inputs.reponame }}"
            resumeBudget: 3
            waitSeconds: 1800
        # No `orun.secrets/exists@v1` here: there is no infra component, so
        # nothing lease-publishes a WIRING_* secret and nothing waits on one.
        - id: verify
          uses: orun.http/probe@v1
          narrate: "The Worker's index answered on stage and prod."
          with:
            urls:
              - "https://{{ .inputs.reponame }}-recipes-stage.{{ .inputs.subdomain }}.workers.dev"
              - "https://{{ .inputs.reponame }}-recipes-prod.{{ .inputs.subdomain }}.workers.dev"

  # Places nothing. It records what 01-product built, from PROBED facts
  # rather than from what the blueprint intended — which is why it runs last
  # and why its verify is the probe 01-product ends on.
  - name: 02-docs
    title: The deployment, recorded
    description: The live-deployment manifest, rendered from probed reality, and the promotion gate and dev's lanes put back.
    expectedMinutes: 2
    narrate:
      start:  "Now recording what was actually built — probing every URL and writing the deployment manifest into the repository."
      await:  "Probing the live endpoints one last time."
      done:   "ai/context/deployment.md now records the live deployment, written from probed facts, and prod waits on stage again. {{ .meta.elapsed }}."
      failed: "The deployment record did not land. The Worker is still live; only the write-up is missing."
    modules: []
    requires:
      phases: [01-product]
    hooks:
      pre:
        - id: task
          uses: orun.task/ensure@v1
          with:
            kind: task
            epic: "{{ .inputs.epicSlug }}"
            milestone: "{{ .phase.name }}"
            name: "Record the live deployment"
            prefix: BASE
            contract: .baseline/tasks/02-docs.TaskContract.yaml
      post:
        # THE PRODUCT GOES LIVE WITH ITS PROMOTION GATE. 01-product deferred
        # `prod.promotion.dependsOn: [stage]`; this, the last landing, puts it
        # back, and from here on a change reaches prod only after stage.
        # Restoring touches only intent.yaml's `environments` section, which
        # `orun plan --changed` maps to no component, so this landing
        # redeploys nothing.
        - id: promotion
          run: ["node", "{{ .baseline.dir }}/tooling/bootstrap/promotion.mjs", "--restore"]
        # And dev verifies every merge to main again (01-product deferred it).
        - id: dev-lanes
          run: ["node", "{{ .baseline.dir }}/tooling/bootstrap/dev-lanes.mjs", "--restore"]
        - id: render
          run: ["bash", "{{ .baseline.dir }}/hooks/render-deployment-docs.sh", ".", "{{ .inputs.orunWorkspace }}", "{{ .baseline.dir }}"]
        - id: land
          uses: orun.pr/land@v1
          narrate: "The deployment record is merged into main."
          with:
            task: "{{ .phase.hooks.task.outputs.key }}"
            epic: "{{ .inputs.epicSlug }}"
            branchSlug: "{{ .phase.name }}"
            title: "docs(deployment): record the live deployment state"
      await:
        - id: verify
          uses: orun.http/probe@v1
          narrate: "Every live URL answered on the final probe."
          with:
            urls:
              - "https://{{ .inputs.reponame }}-recipes-stage.{{ .inputs.subdomain }}.workers.dev"
              - "https://{{ .inputs.reponame }}-recipes-prod.{{ .inputs.subdomain }}.workers.dev"
